<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmark Peeler</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="index.js"></script>
</head>
<body>
  <header>
    <h1>Bookmark Peeler</h1>
    <div class="tools">
      <details id="presets" class="menu">
        <summary>Presets</summary>
        <div id="presets-list" class="menu-list"></div>
      </details>
      <button id="export" type="button" title="Save rules and settings to a file">Export…</button>
      <button id="import" type="button" title="Bring rules and settings in from a file">Import…</button>
      <button id="settings-button" type="button" aria-pressed="false"><span class="icon icon-gear" aria-hidden="true"></span>Settings</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section class="sidebar" aria-labelledby="rules-heading">
      <div class="sidebar-head">
        <h2 id="rules-heading">Rules</h2>
        <button id="collapse" type="button" class="icon-btn" aria-expanded="true" aria-label="Hide the rule list" title="Hide the rule list ([)"><span class="icon icon-chevron-left" aria-hidden="true"></span></button>
      </div>
      <button id="add" type="button" class="sidebar-add" aria-label="Add rule" title="Add rule"><span class="icon icon-plus" aria-hidden="true"></span><span class="full">Add rule</span></button>
      <p id="notice" class="notice" role="alert" hidden></p>
      <ul id="rules" class="rules" aria-label="Rules"></ul>
    </section>

    <section id="editor" class="editor" aria-label="Rule editor"></section>
    <section id="settings" class="editor" aria-label="Settings" hidden></section>

    <section id="empty" class="editor empty" aria-label="No rules" hidden>
      <h2>No rules yet</h2>
      <p>Bookmark Peeler cleans the URL of a bookmark when you save it, using rules you create.</p>
      <div class="empty-actions">
        <button id="empty-add" type="button" class="primary">Add rule</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" type="button" title="Ctrl+Z">Undo</button>
  </div>

  <dialog id="bulk-dialog" class="hl-text" aria-labelledby="bulk-title">
    <form method="dialog">
      <p id="bulk-title"><strong>Clean existing bookmarks</strong></p>
      <p id="bulk-summary"></p>
      <details id="bulk-details" hidden>
        <summary id="bulk-details-summary"></summary>
        <div class="bulk-head">
          <div class="pair" aria-hidden="true"><span>Before</span><span>After</span></div>
          <div class="segmented" role="radiogroup" aria-label="How to mark the changed parts">
            <label><input type="radio" name="bulk-highlight" value="text"><span>Text colour</span></label>
            <label><input type="radio" name="bulk-highlight" value="background"><span>Background</span></label>
          </div>
        </div>
        <ul id="bulk-list" class="bulk-list"></ul>
        <button id="bulk-more" type="button" hidden>Show more…</button>
      </details>
      <div class="buttons">
        <button id="bulk-clean" value="clean" autofocus hidden>Clean</button>
        <button id="bulk-close" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="export-dialog" aria-labelledby="export-title">
    <form method="dialog">
      <p id="export-title"><strong>Export</strong></p>
      <div class="choices">
        <label class="check"><input id="export-settings" type="checkbox" checked> Settings</label>
        <label class="check"><input id="export-rules" type="checkbox" checked> Rules</label>
      </div>
      <div class="buttons">
        <button id="export-go" value="export" autofocus>Export</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="import-dialog" aria-labelledby="import-title">
    <form method="dialog">
      <p id="import-title"><strong>Import</strong></p>
      <ul id="import-lines" class="lines"></ul>
      <div id="import-settings-row" class="choices" hidden>
        <label class="check"><input id="import-settings" type="checkbox" checked>Settings</label>
      </div>
      <div id="import-rules-row" class="choices" hidden>
        <label class="check"><input id="import-rules" type="checkbox" checked>Rules</label>
        <fieldset id="import-how" class="choices nested">
          <label class="check"><input type="radio" name="import-how" value="replace"> Replace my rules</label>
          <label class="check"><input type="radio" name="import-how" value="add" checked> Add to my rules</label>
        </fieldset>
      </div>
      <div class="buttons">
        <button id="import-go" value="import" autofocus>Import</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="unsaved" aria-labelledby="unsaved-text">
    <form method="dialog">
      <p id="unsaved-text">This rule has unsaved changes.</p>
      <div class="buttons">
        <button value="save" autofocus>Save</button>
        <button value="discard">Discard</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
