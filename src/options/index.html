<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmark Peeler</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="index.js"></script>
</head>
<body>
  <header>
    <h1>Bookmark Peeler</h1>
    <div class="tools">
      <details id="presets" class="menu">
        <summary>Presets</summary>
        <div id="presets-list" class="menu-list"></div>
      </details>
      <button id="import" type="button" title="Add rules from a file, or replace the current ones">Import…</button>
      <button id="export" type="button" title="Save all rules to a file">Export</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section class="sidebar" aria-labelledby="rules-heading">
      <div class="sidebar-head">
        <h2 id="rules-heading">Rules</h2>
        <div class="sidebar-actions">
          <button id="add" type="button" title="Add rule"><span class="full">Add rule</span><span class="short" aria-hidden="true">+</span></button>
          <button id="collapse" type="button" aria-expanded="true" aria-label="Hide the rule list" title="Hide the rule list ([)">«</button>
        </div>
      </div>
      <p id="notice" class="notice" role="alert" hidden></p>
      <ul id="rules" class="rules" aria-label="Rules"></ul>
    </section>

    <section id="editor" class="editor" aria-label="Rule editor"></section>
  </main>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" type="button" title="Ctrl+Z">Undo</button>
  </div>

  <dialog id="import-dialog" aria-labelledby="import-title">
    <form method="dialog">
      <p id="import-title"><strong>Import rules</strong></p>
      <ul id="import-lines" class="lines"></ul>
      <div class="buttons">
        <button value="add" autofocus>Add to my rules</button>
        <button value="replace">Replace my rules</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="unsaved" aria-labelledby="unsaved-text">
    <form method="dialog">
      <p id="unsaved-text">This rule has unsaved changes.</p>
      <div class="buttons">
        <button value="save" autofocus>Save</button>
        <button value="discard">Discard</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
